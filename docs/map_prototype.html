<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>세로 분기 지도 시제품</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171c18;color:#f5e9c8;font-family:system-ui,sans-serif}.top{display:flex;align-items:center;gap:10px;padding:12px 18px}.top h1{font-size:18px;margin:0 auto 0 0}.btn{font:inherit;color:#faebc6;background:#403021;border:1px solid #b9a072;border-radius:5px;padding:7px 12px;cursor:pointer}.layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;max-width:1050px;margin:auto;padding:0 16px 16px}.viewport{height:78vh;overflow:auto;background:#211a10;border:6px solid #473321;border-radius:8px;box-shadow:0 7px 24px #0008}.sheet{position:relative;width:100%;min-width:480px;height:1500px;overflow:hidden;background-color:#d4a86c;background-image:radial-gradient(ellipse at 25% 30%,#e3bb7d88,transparent 60%),radial-gradient(ellipse at 75% 70%,#a86d3e44,transparent 65%),repeating-linear-gradient(73deg,#6c45130a 0 1px,transparent 1px 5px);transform-origin:top;animation:unfold .45s ease-out}.sheet::before,.sheet::after{content:'';position:absolute;left:0;right:0;height:min(44vw,390px);background-image:url('art_reference/map_background_concept.png');background-size:100% auto;background-repeat:no-repeat;pointer-events:none}.sheet::before{top:0;background-position:center top;mask-image:linear-gradient(#000 0%,#000 35%,transparent 100%)}.sheet::after{bottom:0;background-position:center bottom;mask-image:linear-gradient(transparent 0%,#000 65%,#000 100%)}svg,.node{z-index:1}@keyframes unfold{from{clip-path:inset(0 0 96% 0)}to{clip-path:inset(0)}}@media(prefers-reduced-motion:reduce){.sheet{animation:none}}svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.node{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:3px solid #3b2a1c;background:#e5ca92;color:#34251c;font-size:21px;font-weight:bold;box-shadow:0 2px 5px #24190d88;cursor:pointer}.node:disabled{opacity:.65;cursor:not-allowed}.node.reachable{background:#fff0b9;border-color:#59341e;box-shadow:0 0 0 4px #fff2a68c,0 0 16px #fff5a0}.node.current{background:#566d43;border-color:white;color:white}.node.chosen{outline:4px solid #9e3122;outline-offset:4px}.boss{width:60px;height:60px;font-size:29px}.legend{background:#29362c;padding:15px;border:1px solid #6b5d41;border-radius:8px;line-height:1.6}.legend h2{font-size:17px;margin:0}.legend p{font-size:14px}.legend small{color:#d2c6aa}.key{font-size:14px;line-height:2}button:focus-visible{outline:3px solid #fff;outline-offset:4px}[hidden]{display:none!important}@media(max-width:760px){.layout{grid-template-columns:1fr}.viewport{height:65vh}}
</style></head><body><div class="top"><h1>분기 지도 시제품</h1><button class="btn" id="toggle">지도 접기</button><button class="btn" id="reset">새 지도</button></div><div class="layout"><div class="viewport" id="viewport" aria-label="세로 분기 지도"><div class="sheet" id="sheet"><svg id="lines" viewBox="0 0 1000 1500" preserveAspectRatio="none" aria-hidden="true"></svg></div></div><aside class="legend"><h2 id="name">다음 노드를 고르세요</h2><p id="description">현재 위치에서 연결된 노드만 선택할 수 있습니다. 위로 스크롤해 경로를 살펴보세요.</p><button id="advance" class="btn" disabled>선택한 노드로 이동</button><p class="key">⚔ 전투　☠ 엘리트<br>✚ 휴식　◆ 보물<br>？ 이벤트　▣ 상점<br>★ 보스　● 현재 위치</p><small>화면 구조 확인용 시제품입니다. 노드 수·분포·임시 생성은 실제 게임 규칙이 아닙니다. 서버 및 협동과 연결되지 않았습니다.</small></aside></div><script>
const viewport=document.querySelector('#viewport'),sheet=document.querySelector('#sheet'),lines=document.querySelector('#lines'),nameEl=document.querySelector('#name'),description=document.querySelector('#description'),advance=document.querySelector('#advance');const types=[['⚔','일반 전투'],['☠','엘리트'],['✚','휴식'],['◆','보물볼'],['？','이벤트'],['▣','상점']];let nodes=[],edges=[],current='start',chosen=null;
function generate(){nodes=[{id:'start',x:500,y:1430,row:0,icon:'●',name:'현재 위치'}];edges=[];for(let row=1;row<=10;row++){const count=row===10?1:3;for(let col=0;col<count;col++){const t=row===10?['★','보스']:types[Math.floor(Math.random()*types.length)];nodes.push({id:row+'-'+col,x:count===1?500:260+col*240+(Math.random()-.5)*45,y:1430-row*130,row,icon:t[0],name:t[1]})}}for(let row=0;row<10;row++){const from=nodes.filter(n=>n.row===row),to=nodes.filter(n=>n.row===row+1);for(const n of from){const nearest=[...to].sort((a,b)=>Math.abs(a.x-n.x)-Math.abs(b.x-n.x));for(const target of nearest.slice(0,row===0?2:row===9?1:2))edges.push([n.id,target.id])}for(const target of to){if(!edges.some(e=>e[1]===target.id)){const n=[...from].sort((a,b)=>Math.abs(a.x-target.x)-Math.abs(b.x-target.x))[0];edges.push([n.id,target.id])}}}current='start';chosen=null;draw();requestAnimationFrame(()=>viewport.scrollTop=viewport.scrollHeight)}
function draw(){sheet.querySelectorAll('.node').forEach(e=>e.remove());lines.replaceChildren();for(const [a,b] of edges){const p=nodes.find(n=>n.id===a),q=nodes.find(n=>n.id===b),path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M ${p.x} ${p.y} C ${p.x} ${p.y-65}, ${q.x} ${q.y+65}, ${q.x} ${q.y}`);path.setAttribute('fill','none');path.setAttribute('stroke',a===current?'#fff1b2':'#654933');path.setAttribute('stroke-width',a===current?'6':'4');path.setAttribute('stroke-dasharray','8 8');lines.append(path)}for(const n of nodes){const reachable=edges.some(e=>e[0]===current&&e[1]===n.id),btn=document.createElement('button');btn.className='node'+(reachable?' reachable':'')+(n.id===current?' current':'')+(n.id===chosen?' chosen':'')+(n.icon==='★'?' boss':'');btn.style.left=n.x/10+'%';btn.style.top=n.y/15+'%';btn.textContent=n.icon;btn.disabled=!reachable;btn.setAttribute('aria-label',n.name+(reachable?' 선택 가능':n.id===current?' 현재 위치':' 선택 불가'));btn.title=btn.getAttribute('aria-label');btn.onclick=()=>{chosen=n.id;draw()};sheet.append(btn)}const n=nodes.find(x=>x.id===chosen);nameEl.textContent=n?n.name:'다음 노드를 고르세요';description.textContent=n?'선택된 경로입니다. 이동 버튼을 눌러 다음 노드로 진행합니다.':'현재 위치에서 연결된 노드만 선택할 수 있습니다. 위로 스크롤해 경로를 살펴보세요.';advance.disabled=!n;if(!edges.some(e=>e[0]===current)){nameEl.textContent='보스 도착';description.textContent='시제품의 마지막 노드입니다.'}}
advance.onclick=()=>{if(chosen){current=chosen;chosen=null;draw();const n=nodes.find(x=>x.id===current);viewport.scrollTo({top:Math.max(0,n.y-viewport.clientHeight*.7),behavior:'smooth'})}};document.querySelector('#reset').onclick=generate;document.querySelector('#toggle').onclick=e=>{viewport.hidden=!viewport.hidden;e.currentTarget.textContent=viewport.hidden?'지도 펼치기':'지도 접기';if(!viewport.hidden){sheet.style.animation='none';void sheet.offsetWidth;sheet.style.animation=''}};generate();
</script></body></html>
